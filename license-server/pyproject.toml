[project]
name = "chesslab-license-server"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.159,<0.160", "uvicorn>=0.54,<0.55", "SQLAlchemy>=2.0.55,<2.1",
  "alembic>=1.20,<1.21", "pydantic-settings>=2.16,<2.17", "cryptography>=50,<51",
  "argon2-cffi>=25.1,<26", "psycopg[binary]>=3.3,<3.4", "email-validator>=2.3,<3",
]
[project.optional-dependencies]
test = ["pytest>=9,<10", "httpx>=0.28,<0.29"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: membutuhkan PostgreSQL sungguhan"]
