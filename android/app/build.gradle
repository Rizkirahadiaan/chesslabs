plugins { id 'com.android.application' }
android {
    namespace 'id.chesslab.coach'
    compileSdk 36
    defaultConfig { applicationId 'id.chesslab.coach'; minSdk 34; targetSdk 36; versionCode 4; versionName '0.2.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += '**/libstockfish.so' } }
}
